name: Feature request
description: Propose a focused product or engineering improvement
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or operational problem should be solved?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the smallest useful result, not the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: dropdown
    id: focus
    attributes:
      label: MVP relevance
      options:
        - Required for the active MVP
        - Strategic backlog
        - Someday
    validations:
      required: true
  - type: input
    id: task
    attributes:
      label: Related Notion task or ticket
